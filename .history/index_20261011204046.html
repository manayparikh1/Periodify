<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodify</title>
</head>

<body>
    <!-- === HTML STARTS here===-->
    <header>
        <h1>Period<span>ify</span></h1>
        <p>Hover (or tap) an element and you can hover over the legend to isolate that specific group.</p>
    </header>
    <!-- === Legend === -->
    <ul class="legend">
        <li class="l-am" style="--c: var(--am);">Alkali metals</li>
        <li class="l-aem" style="--c: var(--aem);">Alkaline earth metals</li>
        <li class="l-tm" style="--c: var(--ac);">Transition metals</li>
        <li class="l-ptm" style="--c: var(--aem);">Post-transition metals</li>
        <li class="l-m" style="--c: var(--rnm);">Metalloids</li>
        <li class="l-hg" style="--c: var(--ptt);">Halogens</li>
        <li class="l-nm" style="--c: var(--nm);">Nonmetals</li>
        <li class="l-ng" style="--c: var(--hl);">Noble gases</li>
        <li class="l-la" style="--c: var(--la);">Lanthanides</li>
        <li class="l-aa" style="--c: var(--hl);">Actinides</li>
    </ul>
</body>

















































<style>

    :root {

        --am: #4fa75f;
        /*Alkali metals*/
        --ml: #96773a;
        /*alkaline earth metals*/
        --ac: #765545;
        /*transition metals*/
        --aem: #ffb;
        /*post transition metals*/
        --rnm: rgb(104, 117, 238);
        /*metalloids*/
        --ptt: rgb(189, 153, 210);
        /*halogens*/
        --nm: rgb(234, 121, 121);
        /*non metals*/
        --hl: #bf9b9b;
        /*noble gases*/
        --hl: #f48fb1;
        /*actinades */
        --la: #c0df9d;
        /*lanthanides */

        --wobble: 255px 15px 225px 15px / 15px 225px 15px 255px;
